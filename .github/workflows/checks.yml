# Raw data is not in the repository, so CI does not re-run the notebooks. It tests the dashboard, checks that
# the committed results and their app copies agree, and checks that the README shows the committed results.
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Streamlit AppTest suite
        run: python -m pytest tests

      - name: Results match the committed version
        run: python scripts/run_pipeline.py --check

      - name: README is up to date
        run: python scripts/update_readme.py --check
